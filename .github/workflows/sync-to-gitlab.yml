name: sync-to-gitlab

# When GitHub main changes (incl. merged PRs), poke the GitLab sync pipeline.
# GitLab is canonical and runs the actual merge logic.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trigger-gitlab:
    runs-on: ubuntu-latest
    # Skip the sync bot's own pushes to avoid ping-pong.
    if: ${{ github.event.head_commit.author.name != 'gitlab-github-sync' }}
    steps:
      - name: Trigger GitLab sync pipeline
        run: |
          curl -fsS -k -X POST \
            -F "token=${{ secrets.GITLAB_TRIGGER_TOKEN }}" \
            -F "ref=main" \
            "https://${{ secrets.GITLAB_HOST }}/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/trigger/pipeline"
